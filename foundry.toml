[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Robinhood Chain is an Arbitrum Orbit chain. Cancun is safely supported there
# (OpenZeppelin 5.6 needs MCOPY, which arrived in Cancun).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[fmt]
line_length = 120
